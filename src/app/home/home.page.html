<ion-tabs>
  <ion-tab-bar class="bottom-nav">
    <ion-tab-button
      tab="dashboard"
      routerLink="/dashboard"
      routerLinkActive="tab-selected"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <ion-icon name="home" aria-hidden="true"></ion-icon>
      <ion-label>Dashboard</ion-label>
    </ion-tab-button>
    <ion-tab-button
      tab="sales"
      routerLink="/sales"
      routerLinkActive="tab-selected"
      [routerLinkActiveOptions]="{ exact: true }"
    > 
      <ion-icon name="analytics-outline" aria-hidden="true"></ion-icon>
      <ion-label>Sales</ion-label>
    </ion-tab-button>
    <ion-tab-button
      tab="customers"
      routerLink="/customers"
      routerLinkActive="tab-selected"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <ion-icon name="people" aria-hidden="true"></ion-icon>
      <ion-label>Customers</ion-label>
    </ion-tab-button>
    <ion-tab-button
      tab="recovery"
      routerLink="/recovery"
      routerLinkActive="tab-selected"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <ion-icon name="calendar" aria-hidden="true"></ion-icon>
      <ion-label>Recovery</ion-label>
    </ion-tab-button>
    <ion-tab-button
      tab="profile"
      routerLink="/profile"
      routerLinkActive="tab-selected"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <ion-icon name="person" aria-hidden="true"></ion-icon>
      <ion-label>Profile</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
