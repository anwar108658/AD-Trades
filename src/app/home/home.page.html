<ion-tabs>
  <ion-tab-bar class="bottom-nav">
    @for (item of MainNavigationItems(); track item.tab) {
        <ion-tab-button
          [id]="item.id"
          [tab]="item.tab"
          [routerLink]="item.route"
          routerLinkActive="tab-selected"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <ion-icon
            [name]="item.icon"
            aria-hidden="true"
          ></ion-icon>
  
          <ion-label>{{ item.label }}</ion-label>
        </ion-tab-button>
      
    }
  </ion-tab-bar>
</ion-tabs>

  <ion-modal
    #navigationModal
    trigger="open-model"
    [initialBreakpoint]="0.5"
    [breakpoints]="[0, 0.25, 0.5, 0.75]"
    handleBehavior="cycle"
  >
    <ng-template>
      <ion-content class="ion-padding">
        <h2 class="navigation-grid-title">Dock Menu</h2>
        <div class="navigation-grid">
          @for (item of navigationItems(); track item.id) {
            <ion-button
              class="navigation-grid-button"
              fill="clear"
              color="medium"
              [routerLink]="item.route"
              (click)="navigationModal.dismiss()"
            >
              <div class="navigation-grid-button-content">
                <ion-icon style="margin-right: 8px;" [name]="item.icon" aria-hidden="true"></ion-icon>
                <ion-label>{{ item.label }}</ion-label>
              </div>
            </ion-button>
          }
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>
