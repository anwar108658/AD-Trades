<ion-content class="login-page" [fullscreen]="true">
  <div class="login-layout">
    <ion-card class="login-card">
      <ion-card-header>
        <ion-card-subtitle color="tertiary">Sign in to manage your installment business</ion-card-subtitle>
        <ion-card-title color="blue">Welcome Back !</ion-card-title>
        <div style="width: 120px; margin: 10px 0;margin-top: 25px;">
          <ion-img
            slot="end"
            [src]="isDarkMode() ? '../../../../assets/icon/nlogo.png' : '../../../../assets/icon/nlogo.png'"
            style="width: 100%;"
            alt="The Wisconsin State Capitol building in Madison, WI at night"
          ></ion-img>
        </div>
      </ion-card-header>

      <ion-card-content>
        <ion-item class="login-field" lines="none">
          <ion-input
            label="Email address"
            labelPlacement="stacked"
            type="email"
            inputmode="email"
            autocomplete="email"
            placeholder="you@gmail.com"
            [(ngModel)]="email"
          >
          <ion-icon slot="start" name="mail-outline" aria-hidden="true"></ion-icon>
        </ion-input>
      </ion-item>
      
      <ion-item class="login-field" lines="none">
        <ion-input
            label="Password"
            labelPlacement="stacked"
            type="password" 
            autocomplete="current-password"
            placeholder="Enter your password"
            [(ngModel)]="password"
          >
            <ion-icon slot="start" name="lock-closed-outline" aria-hidden="true"></ion-icon>
          </ion-input>
        </ion-item>
          <ion-button color="blue" size="small" class="login-button" expand="block">LOG IN</ion-button>
        <ion-label class="signup-prompt">
          Don't have an account? <ion-text color="primary">Contact your administrator</ion-text>
        </ion-label>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
